# ==============================================================================
# Plesk / Nginx Reverse Proxy Configuration for Vaultwarden (Rust Bitwarden)
# Architecture: Onur Aksoy (a.k.a. Hackonomist) — https://onuraksoy.com.tr
# Repository: https://github.com/oaonuraksoy/oaVaultWardenInstaller
# Location: /etc/nginx/plesk.conf.d/vhosts/vault.yourdomain.com/vaultwarden.conf
# ==============================================================================

# Client upload limits (Encrypted file attachments & large exports)
client_max_body_size 128M;
client_body_buffer_size 128k;

# Security Headers (Defense in Depth)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; object-src 'none'; frame-ancestors 'self';" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# 1. Main Vaultwarden HTTP API & Web Vault
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
}

# 2. Real-Time WebSocket Notification Hub (Bitwarden Live Sync)
location /notifications/hub {
    proxy_pass http://127.0.0.1:3012;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Keep WebSocket connection open without proxy timeout termination
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 3. Notification Hub Handshake Negotiation
location /notifications/hub/negotiate {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 4. Restrict or Rate-Limit Admin Panel (Optional: Whitelist admin IP)
location /admin {
    # allow 192.168.1.0/24;
    # deny all;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
