name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro Portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Tam git geçmişi: sitemap lastmod / dateModified / RSS tarihleri git'ten türetilir.
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v6

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit (high+)
        run: npm audit --audit-level=high

      # astro build + sitemap index + link kontrolü + SEO/GEO koruma kapısı (scripts/check-seo.mjs)
      - name: Build & Validate
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # NOT: Cloudflare önbellek temizleme CI'da YAPILMAZ (AGENTS.md §7.3). Deploy tamamlandıktan sonra
  # ajan/geliştirici yerelden `npm run cf:purge` çalıştırır.
  notify:
    name: Notify Search Engines
    runs-on: ubuntu-latest
    needs: deploy
    # Bildirim hatası yayını geri almaz; yalnızca raporlanır.
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Yalnızca bu push'ta değişen sayfalar IndexNow'a (Bing, Yandex, Seznam, Naver…) bildirilir;
      # içerik değiştiyse /rss.xml için WebSub ping'i gönderilir.
      - name: Notify IndexNow & WebSub
        run: node scripts/ping-search-engines.mjs --since "${{ github.event.before }}"
